# 作用：手动触发的 APK 构建（release/debug 可选，产物上传为 artifact）
name: flutter-build

# 故意不挂在 push 上：Flutter 构建要下 Gradle/AGP，耗时 5-10 分钟，
# 每次提交都跑会拖慢反馈；需要出包时手动点「Run workflow」。
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 构建类型
        required: true
        default: release
        type: choice
        options:
          - release
          - debug

jobs:
  build-apk:
    name: 构建 APK (${{ inputs.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Flutter 3.24.3
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: stable
          cache: true

      - name: 环境信息
        run: |
          flutter --version
          java -version
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

      - name: 接受 Android 许可
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Gradle 分发换官方源（仓库里为国内构建配的是腾讯镜像）
        run: |
          sed -i 's#mirrors.cloud.tencent.com/gradle/#services.gradle.org/distributions/#' \
            android/gradle/wrapper/gradle-wrapper.properties
          grep distributionUrl android/gradle/wrapper/gradle-wrapper.properties

      - name: 拉依赖
        run: flutter pub get

      - name: 静态检查
        run: flutter analyze

      - name: 构建 APK
        run: flutter build apk --${{ inputs.mode }}

      - name: 列出产物
        run: ls -lh build/app/outputs/flutter-apk/ || true

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: caremate-apk-${{ inputs.mode }}
          path: app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14