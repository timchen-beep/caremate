<!DOCTYPE html>
<!-- 作用：家属看板：5 秒刷新进度、长轮询收告警弹红条、计划/记录/告警/统计/云端五个分区 -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CareMate · 家属 / 社区 看板</title>
<style>
  :root{--ink:#1b335c;--soft:#44546a;--line:#d8e1ee;--bg:#f5f7fb;--card:#fff;
        --ok:#1f7a4d;--okbg:#e8f5ee;--warn:#a8620a;--warnbg:#fdf3e3;--bad:#a3282f;--badbg:#fbeaeb;
        --ac:#2e548a;--acbg:#eaf0f9}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "Microsoft YaHei","PingFang SC",system-ui,sans-serif}
  
  header{position:sticky;top:0;z-index:9;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
         background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);padding:10px 18px}
  header h1{font-size:17px;margin:0}
  .spacer{flex:1}
  .tok{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--soft)}
  .tok input{padding:7px 9px;border:1px solid var(--line);border-radius:8px;width:150px;font:inherit;font-size:13px}
  .btn{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--ac);background:var(--ac);
       color:#fff;padding:8px 13px;font-size:14px}
  .btn.line{background:#fff;color:var(--ac)}
  .btn.warn{background:#fff;color:var(--bad);border-color:var(--bad)}
  .btn.tiny{padding:5px 9px;font-size:12.5px;border-radius:6px;margin-left:4px}
  .wrap{max-width:1180px;margin:0 auto;padding:18px 16px 70px}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:16px}
  .tab{border:none;background:none;font:inherit;color:var(--soft);padding:9px 13px;cursor:pointer;border-bottom:3px solid transparent}
  .tab.on{color:var(--ac);border-bottom-color:var(--ac);font-weight:700}
  .cards{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .card .k{color:var(--soft);font-size:12.5px}
  .card .v{font-size:24px;font-weight:700;margin-top:2px}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:16px}
  .panel h2{font-size:16px;margin:0 0 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .panel h2 .sub{font-weight:400;color:var(--soft);font-size:12.5px}
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:8px 7px;border-bottom:1px solid var(--line);vertical-align:top}
  th{font-weight:600;color:var(--soft);font-size:12.5px}
  .pill{display:inline-block;padding:1px 9px;border-radius:999px;font-size:12px;white-space:nowrap}
  .pill.ok{background:var(--okbg);color:var(--ok)}
  .pill.warn{background:var(--warnbg);color:var(--warn)}
  .pill.bad{background:var(--badbg);color:var(--bad)}
  .pill.idle{background:#eef1f5;color:var(--soft)}
  .pill.info{background:var(--acbg);color:var(--ac)}
  form.inline{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
  form.inline label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--soft)}
  form.inline input,form.inline select{font:inherit;padding:8px 9px;border:1px solid var(--line);
      border-radius:8px;background:#fff;color:var(--ink);font-size:14px}
  .msg{margin-top:10px;font-size:14px;font-weight:700;display:none;padding:9px 11px;border-radius:8px}
  .msg.ok{display:block;background:var(--okbg);color:var(--ok)}
  .msg.bad{display:block;background:var(--badbg);color:var(--bad)}
  .chart{display:flex;align-items:flex-end;gap:14px;height:140px;border-bottom:1px solid var(--line);
         padding-bottom:2px;margin:10px 0 6px}
  .bar{flex:0 0 42px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;height:100%}
  .bar .seg{border-radius:3px 3px 0 0}
  .bar .c{background:#4a7c59}.bar .s{background:#d9a441}.bar .m{background:#c0565c}
  .bar .lab{font-size:11px;color:var(--soft);text-align:center;margin-top:4px}
  .hint{color:var(--soft);font-size:12.5px;margin-top:8px;line-height:1.7}
  .kv{display:grid;grid-template-columns:180px 1fr;gap:4px 12px;font-size:14px}
  .kv .k{color:var(--soft)}
  code{background:#eef2f8;border-radius:5px;padding:1px 5px;font-size:12.5px}
  .hide{display:none !important}

  /* ---- 求救横幅：粘在顶部，红底白字，不点掉不消失 ---- */
  .sosbar{position:fixed;left:0;right:0;top:0;z-index:999;background:#7e1b22;color:#fff;
          display:none;padding:16px 22px;box-shadow:0 8px 24px rgba(126,27,34,.35);
          animation:sosPulse 1s ease-in-out infinite alternate}
  .sosbar.on{display:flex}
  .sosbar .txt{flex:1}
  .sosbar .t1{font-size:24px;font-weight:800;letter-spacing:1px}
  .sosbar .t2{font-size:15px;opacity:.92;margin-top:4px}
  .sosbar button{background:#fff;color:#7e1b22;border:none;border-radius:10px;
                 font:inherit;font-size:18px;font-weight:800;padding:12px 20px;cursor:pointer}
  @keyframes sosPulse{from{background:#7e1b22}to{background:#a3282f}}
  body.has-sos{padding-top:96px}

  /* ---- 实时提示条（非求救的告警用） ---- */
  .toastline{position:fixed;right:16px;top:16px;z-index:998;background:#1f2a44;color:#fff;
             border-radius:10px;padding:10px 14px;font-size:14px;display:none;max-width:420px}
  tr.sos-row{background:#f9e3e5 !important;outline:2px solid #7e1b22}
  @keyframes flashTitle{0%{opacity:1}50%{opacity:.25}100%{opacity:1}}
  .flashing{animation:flashTitle 1s ease-in-out 3}
  @media (max-width:900px){.cards{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<header>
  <h1>CareMate 看板</h1>
  <a href="/app" target="_blank" class="btn line" style="text-decoration:none">老人端 ›</a>
  <span class="spacer"></span>
  <div class="tok">
    <span>令牌</span>
    <input id="token" value="fam-demo-2026">
    <span id="role" class="pill info">—</span>
    <button class="btn" id="btnReload">刷新</button>
    
  </div>
</header>

<div class="sosbar" id="sosBar">
  <div class="txt">
    <div class="t1" id="sosTitle">有人呼救！</div>
    <div class="t2" id="sosSub"></div>
  </div>
  <button id="sosAck">我看到了</
