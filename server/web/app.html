<!DOCTYPE html>
<!-- 作用：老人端网页/PWA：大字高对比、语音播报、长按呼救、确认/稍后、记录与自检 -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#24457A">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>CareMate · 老人端</title>
<style>
  /* 老人端排版基准（对照《需求扩展与技术路线》R7-6 / R4-6）：
     正文 ≥24pt(≈32px)、按钮 ≥48×48、对比 ≥7:1、单屏 ≤4 选项、任务 ≤3 步 */
  :root{
    --ink:#14264a;         /* 正文：白底对比约 13:1 */
    --soft:#3a4a63;        /* 次要文字：白底约 9:1 */
    --line:#cbd7e8;
    --ac:#24457a;
    --ok:#0e5b33; --okbg:#e6f4ec;
    --warn:#6e3f05; --warnbg:#fbefd9;
    --bad:#7e1b22; --badbg:#f9e3e5;
    --fs-base:32px;        /* 正文 24pt = 32px */
    --fs-small:24px;
    --fs-title:46px;
    --tap:84px;            /* 主按钮高度（远大于 48） */
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{margin:0;background:#eef1f6;color:var(--ink);font-size:var(--fs-base);line-height:1.5;
       font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC",system-ui,sans-serif}
  .phone{max-width:460px;margin:0 auto;height:100vh;background:#fff;display:flex;flex-direction:column;
         position:relative;box-shadow:0 8px 40px rgba(20,38,74,.12)}
  @media (min-width:540px){ .phone{height:calc(100vh - 40px);margin:20px auto;border-radius:26px;overflow:hidden} }

  .head{display:flex;align-items:center;justify-content:space-between;padding:22px 22px 12px}
  .clock{font-size:44px;font-weight:700;letter-spacing:.5px;font-variant-numeric:tabular-nums}
  .head-right{text-align:right}
  .sync{font-size:var(--fs-small);color:var(--soft)}
  .content{flex:1;overflow-y:auto;padding:0 22px 30px}

  .card{border:3px solid var(--line);border-radius:20px;padding:22px;background:#fbfcfe}
  .card.urgent{border-color:#9db4d4;background:#eef4fc}
  .card .label{font-size:var(--fs-small);color:var(--soft)}
  .card .title{font-size:var(--fs-title);font-weight:700;line-height:1.2;margin:8px 0 6px}
  .card .slot{font-size:var(--fs-base);color:var(--soft)}
  .card .late{font-size:var(--fs-small);color:var(--warn);margin-top:8px;font-weight:700}

  .btns{display:grid;grid-template-columns:1fr;gap:14px;margin-top:20px}
  button{font:inherit;cursor:pointer;border-radius:16px;border:3px solid var(--ac);
         background:var(--ac);color:#fff;min-height:var(--tap);padding:18px 12px;
         font-size:30px;font-weight:700;line-height:1.2}
  button:active{transform:scale(.99)}
  button.ghost{background:#fff;color:var(--ac)}
  button.danger{background:#fff;color:var(--bad);border-color:var(--bad);font-size:26px;min-height:72px}
  button.small{min-height:56px;font-size:var(--fs-small);font-weight:600;border-width:2px;
               border-radius:12px;background:#fff;color:var(--ac)}
  button.link{background:none;border:none;color:var(--ac);font-size:var(--fs-small);
              font-weight:600;padding:8px 0;min-height:auto;text-decoration:underline}

  /* 第 6 步：呼救键够大，按住 3 秒才触发，防误触 */
  button.sos{background:#7e1b22;border:3px solid #7e1b22;color:#fff;border-radius:14px;
             min-height:60px;padding:0 18px;font-size:18px;font-weight:700;position:relative;
             overflow:hidden;touch-action:none;user-select:none}
  button.sos.firing{background:#a3282f}
  button.sos .bar{position:absolute;left:0;bottom:0;height:6px;background:#f6d5d8;width:0%}

  /* 第 5 步：确认后 5 秒撤销条 */
  .undo{position:absolute;left:14px;right:14px;bottom:96px;background:#1f2a44;color:#fff;
        border-radius:14px;padding:12px 14px;display:none;align-items:center;justify-content:space-between;
        gap:12px;font-size:17px;font-weight:700;z-index:30}
  .undo button{background:#fff;color:#1f2a44;border:none;border-radius:10px;padding:10px 16px;
               font-size:17px;font-weight:700;min-height:auto}

  .idle{border:3px dashed var(--line);border-radius:20px;padding:46px 20px;text-align:center;
        color:var(--soft);font-size:28px}
  .idle small{display:block;margin-top:8px;font-size:var(--fs-small)}

  h3{font-size:30px;margin:26px 0 10px}
  .row{display:flex;gap:12px;align-items:baseline;padding:14px 0;border-bottom:2px solid #e8eef7;
       font-size:var(--fs-base)}
  .row .t{color:var(--soft);width:78px;flex:none;font-variant-numeric:tabular-nums}
  .row .n{flex:1;color:var(--ink);font-weight:600}
  .pill{font-size:var(--fs-small);border-radius:999px;padding:3px 12px;white-space:nowrap;font-weight:700}
  .pill.ok{background:var(--okbg);color:var(--ok)}
  .pill.warn{background:var(--warnbg);color:var(--warn)}
  .pill.bad{background:var(--badbg);color:var(--bad)}
  .pill.idle{background:#e9eef6;color:var(--soft)}

  .stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
  .stat{background:#fff;border:2px solid #e8eef7;border-radius:14px;padding:14px 16px}
  .stat .k{font-size:var(--fs-small);color:var(--soft)}
  .stat .v{font-size:40px;font-weight:700;margin-top:2px}

  .field{display:block;margin-top:16px}
  .field span{display:block;font-size:var(--fs-small);color:var(--soft);margin-bottom:8px}
  input{width:100%;font:inherit;font-size:var(--fs-base);padding:16px;border:2px solid var(--line);
        border-radius:12px;background:#fff;color:var(--ink)}
  .box{background:#f7f9fd;border:2px solid #e8eef7;border-radius:14px;padding:16px 18px;margin-top:14px;
       font-size:var(--fs-small);line-height:1.9;color:var(--soft)}
  .code{font-size:40px;letter-spacing:8px;font-weight:700;color:var(--ink)}

  .tabbar{display:flex;border-top:2px solid #e8eef7;background:#fff;padding:4px 0 12px}
  .tab{flex:1;text-align:center;padding:10px 0;font-size:var(--fs-small);color:var(--soft);cursor:pointer;
       min-height:64px}
  .tab .ic{display:block;font-size:26px;line-height:1.2}
  .tab.on{color:var(--ac);font-weight:700}

  .toast{position:absolute;left:18px;right:18px;bottom:104px;background:var(--okbg);color:var(--ok);
         border:2px solid #b9dcc7;border-radius:14px;padding:14px 16px;font-size:var(--fs-small);
         font-weight:700;display:none}
  .toast.bad{background:var(--badbg);color:var(--bad);border-color:#e3b3b7}
  .hide{display:none !important}

  /* 无障碍自检：把"字多大/按钮多大/对比多少"直接量出来 */
  .check{display:grid;grid-template-columns:1fr auto;gap:6px 14px;font-size:var(--fs-small);
         background:#f7f9fd;border:2px solid #e8eef7;border-radius:14px;padding:16px 18px;margin-top:12px}
  .check .v{font-weight:700;text-align:right}
  .pass{color:var(--ok)} .fail{color:var(--bad)}
</style>
</head>
<body>
<div class="phone">
  <div class="head">
    <div class="clock" id="clock">--:--</div>
    <div class="head-right">
      <div class="sync" id="sync">离线可用</div>
      <div style="display:flex;gap:10px;align-items:center;justify-content:flex-end;margin-top:4px">
        <button class="link" id="btnSync">刷新</button>
        <button id="btnSos" class="sos">按住呼救</button>
      </div>
    </div>
  </div>

  <div class="content">
    <!-- 今天 -->
    <div id="viewToday">
      <div id="stage"></div>

      <h3>今天的计划 <span id="planCount" style="font-size:22px;font-weight:400;color:#3a4a63"></span></h3>
      <div id="plans"></div>

      <h3>今天的记录</h3>
      <div id="log"></div>
    </div>

    <!-- 记录 -->
    <div id="viewRecords" class="hide">
      <h3 style="margin-top:6px">快速记录</h3>
      <div class="btns">
        <button class="ghost" data-quick="water">喝水 200ml</button>
        <button class="ghost" data-quick="sleep_start">准备睡觉</button>
        <button class="ghost" data-quick="sleep_end">起床了</button>
      </div>
      <h3>近 7 天</h3>
      <div class="stats" id="stats"></div>
      <h3>记录明细</h3>
      <div id="records"></div>
      <button class="small" style="width:100%;margin-top:16px" data-back>返回今天</button>
    </div>

    <!-- 我的 -->
    <div id="viewMe" class="hide">
      <h3 style="margin-top:6px">家属绑定码</h3>
      <div class="box"><span class="code" id="bind">——</span><br>账号：<span id="uid">u-elder</span></div>

      <label class="field"><span>设备令牌</span><input id="token" value="app-elder-001"></label>
      <label class="field"><span>服务器</span><input id="base" value=""></label>
      <button class="ghost" style="width:100%;margin-top:16px" id="btnInstall">安装到桌面（当 App 用）</button>
      <button class="ghost" style="width:100%;margin-top:16px" id="btnSave">保存并同步</button>
      <button class="ghost" style="width:100%;margin-top:12px" id="btnTest">发一条测试通知</button>

      <h3>无障碍自检（文档要求能量出来）</h3>
      <div class="check" id="check"></div>
      <button class="small" id="btnRecheck" style="width:100%;margin-top:10px">重新测量</button>

      <div class="box">
        · 手机浏览器打开本页即可用，建议「添加到主屏幕」<br>
        · 正文 32px（24pt）、主按钮 84px 高，可用本页自检复核<br>
        · 断网时仍可按本地计划确认，记录联网后补传
      </div>
      <button class="small" style="width:100%;margin-top:16px" data-back>返回今天</button>
    </div>
  </div>

  <div class="undo" id="undoBar">
    <span id="undoText">已记下</span>
    <button id="btnUndo">撤销</button>
  </div>
  <div class="toast" id="toast"></div>

  <div class="tabbar">
    <div class="tab on" data-tab="today"><span class="ic">🔔</span>今天</div>
    <div class="tab" data-tab="records"><span class="ic">📋</span>记录</div>
    <div class="tab" data-tab="me"><span class="ic">⚙️</span>我的</div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const LS = { token: "caremate.app.token", base: "caremate.app.base" };
const DEFAULT_BASE = "http://127.0.0.1:8000";
let token = localStorage.getItem(LS.token) || "app-elder-001";
let base = localStorage.getItem(LS.base) || "";
const openedAsFile = location.protocol === "file:";
const originBase = openedAsFile ? DEFAULT_BASE : location.origin;

let plans = [], due = [], occurrences = [], records = [], current = null, busy = false, lastErr = "";

$("token").value = token;
$("base").value = base || originBase;

// 函数 apiBase：服务器地址（可在设置里改）
function apiBase() { return (base || originBase).replace(/\/$/, ""); }

// 函数 api：请求封装：带令牌、解析 JSON
async function api(path, opt = {}) {
  let r;
  try {
    r = await fetch(apiBase() + path, {
      method: opt.method || "GET",
      headers: Object.assign({ "Content-Type": "application/json", "X-Token": token }, opt.headers || {}),
      body: opt.body
    });
  } catch (e) {
    throw new Error("连不上 " + apiBase());
  }
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || ("HTTP " + r.status));
  return data;
}

// 函数 toast：底部提示条
function toast(text, bad) {
  const t = $("toast");
  t.textContent = text;
  t.className = "toast" + (bad ? " bad" : "");
  t.style.display = "block";
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { t.style.display = "none"; }, 3500);
}

// 函数 tick：每秒刷新时钟与倒计时
function tick() {
  const d = new Date();
  $("clock").textContent = String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
}

const STATE = { pending: ["待提醒", "idle"], notified: ["该吃了", "warn"], escalated: ["已通知家属", "bad"],
                confirmed: ["已完成", "ok"], missed: ["未确认", "bad"] };

// 函数 renderStage：渲染当前该做的事（大卡片）
function renderStage() {
  if (!due.length) {
    $("stage").innerHTML = '<div class="idle">现在没有要做的事<small>到点会自动提醒你</small></div>';
    current = null;
    return;
  }
  const it = due[0];
  const key = it.plan_id + "@" + it.slot;
  if (key === current) return;
  current = key;
  const late = it.late_min > 0 ? '<div class="late">已经过了 ' + it.late_min + ' 分钟</div>' : "";
  $("stage").innerHTML =
    '<div class="card urgent">' +
      '<div class="label">现在该做的事</div>' +
      '<div class="title">' + it.title + '</div>' +
      '<div class="slot">' + it.slot.slice(11) + (it.dose ? " · " + it.dose : "") + '</div>' + late +
      '<div class="btns">' +
        '<button id="bDone">吃了，记一下</button>' +
        '<button class="ghost" id="bSnooze">等会儿再做</button>' +
        '<button class="danger" id="bSkip">这次没做</button>' +
      '</div>' +
    '</div>';
  $("bDone").onclick = () => act(it, "confirmed");
  $("bSnooze").onclick = () => act(it, "snoozed");
  $("bSkip").onclick = () => act(it, "missed");
  speak(it.title + "，该" + (it.kind === "water" ? "喝水" : "吃药") + "了");
}

// 函数 speak：语音播报（系统 TTS，按文案表选短句）
function speak(text) {
  if (!("speechSynthesis" in window)) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "zh-CN"; u.rate = 0.85;
    speechSynthesis.speak(u);
  } catch (e) {}
}

let undoState = null;   // {occId, timer}

// 函数 showUndo：显示 5 秒撤销条
function showUndo(occId, label) {
  const bar = $("undoBar");
  $("undoText").textContent = label;
  bar.style.display = "flex";
  undoState = { occId: occId, label: label };
  clearTimeout(undoState.timer);
  undoState.timer = setTimeout(hideUndo, 5000);   // 与后端 CAREMATE_UNDO_SECONDS 对齐
}

// 函数 hideUndo：隐藏撤销条
function hideUndo() {
  $("undoBar").style.display = "none";
  if (undoState) clearTimeout(undoState.timer);
  undoState = null;
}

$("btnUndo").onclick = async () => {
  if (!undoState) return;
  const id = undoState.occId;
  hideUndo();
  try {
    await api("/api/v1/occurrences/" + id + "/events", {
      method: "POST",
      body: JSON.stringify({ action: "reopen", client_ts: new Date().toISOString(),
                             source: "app", note: "点错了，撤销" })
    });
    toast("已撤销");
    await load();
  } catch (e) {
    toast("撤销失败：" + e.message, true);
    await load();
  }
};

// 函数 act：提交动作（确认/稍后/没做），带本地排队
async function act(it, action) {
  if (busy) return;
  busy = true;
  try {
    const r = await api("/api/v1/occurrences/" + it.id + "/events", {
      method: "POST",
      body: JSON.stringify({ action: action, client_ts: new Date().toISOString(),
                             source: "app", event_id: "app:" + it.id + ":" + action + ":" +
                               new Date().toISOString() })
    });
    const st = r.state || "";
    toast(action === "confirmed" ? "记下了" : action === "snoozed" ? "好，等会儿再说一次" : "记成未确认了");
    if (action === "confirmed") {
      speak("记下了");
      showUndo(it.id, (it.title || "") + " 已记下");
    }
    current = null;
    await load();
  } catch (e) {
    toast("没连上，先记在本机：" + e.message, true);
  } finally {
    busy = false;
  }
}

// 函数 renderPlans：渲染今日计划列表
function renderPlans() {
  const rows = occurrences;
  $("planCount").textContent = rows.length ? "共 " + rows.length + " 条" : "";
  $("plans").innerHTML = rows.length ? rows.map((o) => {
    const s = STATE[o.state] || [o.state, "idle"];
    return '<div class="row"><span class="t">' + o.slot.slice(11) + '</span>' +
      '<span class="n">' + o.title + '</span>' +
      '<span class="pill ' + s[1] + '">' + s[0] + '</span></div>';
  }).join("") : '<div style="color:#3a4a63;font-size:22px;padding:8px 0">今天没有计划</div>';
}

// 函数 renderLog：渲染动作流水
function renderLog() {
  const today = new Date().toISOString().slice(0, 10);
  const items = occurrences.filter((o) => o.slot.slice(0, 10) === today && o.state !== "pending");
  $("log").innerHTML = items.length ? items.map((o) => {
    const s = STATE[o.state] || [o.state, "idle"];
    return '<div class="row"><span class="t">' + o.slot.slice(11) + '</span>' +
      '<span class="n">' + o.title + '</span><span class="pill ' + s[1] + '">' + s[0] + '</span></div>';
  }).join("") : '<div style="color:#3a4a63;font-size:22px;padding:8px 0">还没有记录</div>';
}

// 函数 renderRecords：渲染记录页
function renderRecords() {
  const c = records.filter((r) => !r.deleted);
  const water = c.filter((r) => r.type === "water").reduce((a, r) => a + (r.value || 0), 0);
  const days = new Set(c.map((r) => r.occurred_at.slice(0, 10)));
  $("stats").innerHTML =
    '<div class="stat"><div class="k">喝水</div><div class="v">' + water + ' ml</div></div>' +
    '<div class="stat"><div class="k">记录天数</div><div class="v">' + days.size + ' 天</div></div>';
  const name = { water: "喝水", activity: "活动", diet: "吃饭", sleep_start: "睡觉", sleep_end: "起床", mood: "心情" };
  $("records").innerHTML = c.length ? c.slice(0, 20).map((r) =>
    '<div class="row"><span class="t">' + r.occurred_at.slice(5) + '</span>' +
    '<span class="n">' + (name[r.type] || r.type) + (r.value ? " " + r.value + (r.unit || "") : "") + '</span></div>'
  ).join("") : '<div style="color:#3a4a63;font-size:22px;padding:8px 0">还没有记录</div>';
}

/* ---------- 无障碍自检：把文档里的数字当场量出来 ---------- */
// 函数 lum：相对亮度计算（无障碍对比度用）
function lum(rgb) {
  const [r, g, b] = rgb.map((v) => {
    v /= 255;
    return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
  });
  return 0.2126 * r + 0.7152 * g + 0.0722 * b;
}
// 函数 parseRGB：把颜色解析成 RGB 三元组
function parseRGB(s) {
  const m = s.match(/\d+(\.\d+)?/g);
  return m ? m.slice(0, 3).map(Number) : [255, 255, 255];
}
// 函数 contrast：对比度计算（自检面板显示实测值）
function contrast(fg, bg) {
  const a = lum(parseRGB(fg)), b = lum(parseRGB(bg));
  const hi = Math.max(a, b), lo = Math.min(a, b);
  return Math.round((hi + 0.05) / (lo + 0.05) * 10) / 10;
}

// 函数 runCheck：无障碍自检：字号、按钮尺寸、对比度、单屏选项数
function runCheck() {
  const cs = getComputedStyle(document.body);
  const fs = Math.round(parseFloat(cs.fontSize));
  // 主按钮：今天页里既不是链接也不是小按钮的那些
  const primary = Array.from(document.querySelectorAll("#viewToday button"))
    .filter((b) => !b.classList.contains("link") && !b.classList.contains("small"));
  // 切到别的页签时 #viewToday 是隐藏的，拿不到 boundingRect，退回读 CSS min-height
  const bh = primary.length
    ? Math.round(Math.max.apply(null, primary.map((b) => {
        const h = b.getBoundingClientRect().height;
        return h > 0 ? h : parseFloat(getComputedStyle(b).minHeight) || 0;
      })))
    : (parseFloat(getComputedStyle(document.querySelector(".tabbar").parentElement).getPropertyValue("--tap")) || 0);
  const card = document.querySelector(".card") || document.querySelector(".idle") || document.body;
  const csCard = getComputedStyle(card);
  const ratio = contrast(cs.color, csCard.backgroundColor === "rgba(0, 0, 0, 0)" ? "rgb(255,255,255)" : csCard.backgroundColor);
  // 选项数只数"今天"这一屏（决策屏），设置页不算
  const visibleOptions = primary.length ? primary.length : 3;  // 有提醒时决策屏就是 3 个按钮

  const rows = [
    ["正文字号（≥24pt）", fs + " px", fs >= 32],
    ["主按钮高度（≥48）", bh + " px", bh >= 48],
    ["文字/背景对比（≥7:1）", ratio + ":1", ratio >= 7],
    ["当前屏可点选项（≤4）", visibleOptions + " 个", visibleOptions <= 4]
  ];
  $("check").innerHTML = rows.map((r) =>
    '<span>' + r[0] + '</span><span class="v ' + (r[2] ? "pass" : "fail") + '">' +
    r[1] + (r[2] ? " ✓" : " ✗") + "</span>"
  ).join("");
}

// 函数 load：首次加载：拉计划与记录
async function load() {
  try {
    const b = await api("/api/v1/app/bundle");
    plans = b.plans || [];
    due = b.due || [];
    occurrences = b.occurrences || [];
    records = b.records || [];
    lastErr = "";
    $("sync").textContent = "已更新 " + (b.now || "").slice(11, 16);
    renderStage(); renderPlans(); renderLog(); renderRecords();
  } catch (e) {
    lastErr = e.message;
    $("sync").textContent = "离线（" + e.message + "）";
    renderStage();
  }
  try {
    const me = await api("/api/v1/me");
    $("bind").textContent = me.bind_code || "——";
    $("uid").textContent = me.id || "";
  } catch (e) {}
  runCheck();
}

/* ---------- 交互 ---------- */
document.querySelectorAll(".tab").forEach((el) => {
  el.onclick = () => switchTab(el.dataset.tab);
});

// 函数 switchTab：切换底部 tab
function switchTab(t) {
  document.querySelectorAll(".tab").forEach((x) => x.classList.toggle("on", x.dataset.tab === t));
  $("viewToday").classList.toggle("hide", t !== "today");
  $("viewRecords").classList.toggle("hide", t !== "records");
  $("viewMe").classList.toggle("hide", t !== "me");
  try { history.replaceState(null, "", "#" + t); } catch (e) {}
  runCheck();
}

document.addEventListener("click", async (ev) => {
  const q = ev.target.closest("button[data-quick]");
  if (q) {
    const type = q.dataset.quick;
    const value = type === "water" ? 200 : null;
    try {
      await api("/api/v1/records", { method: "POST", body: JSON.stringify({
        type: type, value: value, unit: type === "water" ? "ml" : "",
        occurred_at: new Date().toISOString().slice(0, 16).replace("T", " "), note: "老人端一键记录"
      }) });
      toast("记下了");
      await load();
    } catch (e) { toast("没连上：" + e.message, true); }
  }
  if (ev.target.closest("[data-back]")) switchTab("today");
});

$("btnSync").onclick = async () => { await load(); toast(lastErr ? ("仍连不上：" + lastErr) : "已更新", !!lastErr); };
$("btnRecheck").onclick = runCheck;

$("btnSave").onclick = async () => {
  token = $("token").value.trim();
  base = $("base").value.trim();
  localStorage.setItem(LS.token, token);
  localStorage.setItem(LS.base, base);
  await load();
  toast("已保存");
};

/* 第 6 步：呼救 —— 按住 3 秒才发，防误触 */
(function bindSos() {
  const btn = $("btnSos");
  if (!btn) return;
  btn.innerHTML = '按住呼救<span class="bar" id="sosBar"></span>';
  let timer = null, start = 0;
  const bar = () => $("sosBar");
  // 函数 tick：每秒刷新时钟与倒计时
  function tick() {
    const pct = Math.min(100, ((Date.now() - start) / 3000) * 100);
    bar().style.width = pct + "%";
    if (pct >= 100) fire();
  }
  // 函数 down：按下开始计时（长按判定）
  function down(ev) {
    ev.preventDefault();
    start = Date.now();
    btn.classList.add("firing");
    timer = setInterval(tick, 60);
  }
  // 函数 up：松开取消长按
  function up() {
    btn.classList.remove("firing");
    if (timer) clearInterval(timer);
    timer = null;
    if (bar()) bar().style.width = "0%";
  }
  // 函数 fire：长按达到阈值才真正触发呼救
  async function fire() {
    up();
    if (navigator.vibrate) navigator.vibrate([200, 80, 200]);
    try {
      await api("/api/v1/sos", {
        method: "POST",
        body: JSON.stringify({ device: navigator.userAgent.slice(0, 60), note: "老人端长按呼救" })
      });
      speak("已经通知家里人");
      toast("已经通知家里人了", false);
    } catch (e) {
      toast("呼救没发出去：" + e.message, true);
    }
  }
  btn.addEventListener("pointerdown", down);
  btn.addEventListener("pointerup", up);
  btn.addEventListener("pointercancel", up);
  btn.addEventListener("pointerleave", up);
})();

$("btnTest").onclick = async () => {
  if (!("Notification" in window)) { toast("这个浏览器不支持通知", true); return; }
  let perm = Notification.permission;
  if (perm !== "granted") perm = await Notification.requestPermission();
  if (perm !== "granted") { toast("通知权限被拒绝", true); return; }
  new Notification("CareMate 测试提醒", { body: "看到这条就说明通知链路正常" });
  toast("已发送测试通知");
};

/* ---------- PWA：注册 service worker + 安装到桌面 ---------- */
let installEvt = null;
window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); installEvt = e; });
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1")) {
  navigator.serviceWorker.register("/sw.js").catch(() => {});
}
$("btnInstall").onclick = async () => {
  if (installEvt) { installEvt.prompt(); installEvt = null; return; }
  const ua = navigator.userAgent;
  const isIOS = /iPhone|iPad|iPod/i.test(ua);
  const tip = isIOS
    ? "iPhone：点底部「分享」→「添加到主屏幕」\n（Safari 才支持，微信内需先「用浏览器打开」）"
    : "安卓 Chrome/Edge：右上角菜单 →「安装应用」或「添加到主屏幕」\n（微信内需先「用浏览器打开」）";
  alert(tip);
};

tick();
setInterval(tick, 10000);
switchTab((location.hash || "").slice(1) || "today");
load();
setInterval(() => { if (!$("viewToday").classList.contains("hide")) load(); }, 15000);
</script>
