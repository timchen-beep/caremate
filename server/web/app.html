<!DOCTYPE html>
<!-- 作用：老人端网页/PWA：大字高对比、语音播报、长按呼救、确认/稍后、记录与自检 -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#24457A">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>CareMate · 老人端</title>
<style>
  /* 老人端排版基准（对照《需求扩展与技术路线》R7-6 / R4-6）：
     正文 ≥24pt(≈32px)、按钮 ≥48×48、对比 ≥7:1、单屏 ≤4 选项、任务 ≤3 步 */
  :root{
    --ink:#14264a;         /* 正文：白底对比约 13:1 */
    --soft:#3a4a63;        /* 次要文字：白底约 9:1 */
    --line:#cbd7e8;
    --ac:#24457a;
    --ok:#0e5b33; --okbg:#e6f4ec;
    --warn:#6e3f05; --warnbg:#fbefd9;
    --bad:#7e1b22; --badbg:#f9e3e5;
    --fs-base:32px;        /* 正文 24pt = 32px */
    --fs-small:24px;
    --fs-title:46px;
    --tap:84px;            /* 主按钮高度（远大于 48） */
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{margin:0;background:#eef1f6;color:var(--ink);font-size:var(--fs-base);line-height:1.5;
       font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC",system-ui,sans-serif}
  .phone{max-width:460px;margin:0 auto;height:100vh;background:#fff;display:flex;flex-direction:column;
         position:relative;box-shadow:0 8px 40px rgba(20,38,74,.12)}
  @media (min-width:540px){ .phone{height:calc(100vh - 40px);margin:20px auto;border-radius:26px;overflow:hidden} }

  .head{display:flex;align-items:center;justify-content:space-between;padding:22px 22px 12px}
  .clock{font-size:44px;font-weight:700;letter-spacing:.5px;font-variant-numeric:tabular-nums}
  .head-right{text-align:right}
  .sync{font-size:var(--fs-small);color:var(--soft)}
  .content{flex:1;overflow-y:auto;padding:0 22px 30px}

  .card{border:3px solid var(--line);border-radius:20px;padding:22px;background:#fbfcfe}
  .card.urgent{border-color:#9db4d4;background:#eef4fc}
  .card .label{font-size:var(--fs-small);color:var(--soft)}
  .card .title{font-size:var(--fs-title);font-weight:700;line-height:1.2;margin:8px 0 6px}
  .card .slot{font-size:var(--fs-base);color:var(--soft)}
  .card .late{font-size:var(--fs-small);color:var(--warn);margin-top:8px;font-weight:700}

  .btns{display:grid;grid-template-columns:1fr;gap:14px;margin-top:20px}
  button{font:inherit;cursor:pointer;border-radius:16px;border:3px solid var(--ac);
         background:var(--ac);color:#fff;min-height:var(--tap);padding:18px 12px;
         font-size:30px;font-weight:700;line-height:1.2}
  button:active{transform:scale(.99)}
  button.ghost{background:#fff;color:var(--ac)}
  button.danger{background:#fff;color:var(--bad);border-color:var(--bad);font-size:26px;min-height:72px}
  button.small{min-height:56px;font-size:var(--fs-small);font-weight:600;border-width:2px;
               border-radius:12px;background:#fff;color:var(--ac)}
  button.link{background:none;border:none;color:var(--ac);font-size:var(--fs-small);
              font-weight:600;padding:8px 0;min-height:auto;text-decoration:underline}

  /* 第 6 步：呼救键够大，按住 3 秒才触发，防误触 */
  button.sos{background:#7e1b22;border:3px solid #7e1b22;color:#fff;border-radius:14px;
             min-height:60px;padding:0 18px;font-size:18px;font-weight:700;position:relative;
             overflow:hidden;touch-action:none;user-select:none}
  button.sos.firing{background:#a3282f}
  button.sos .bar{position:absolute;left:0;bottom:0;height:6px;background:#f6d5d8;width:0%}

  /* 第 5 步：确认后 5 秒撤销条 */
  .undo{position:absolute;left:14px;right:14px;bottom:96px;background:#1f2a44;color:#fff;
        border-radius:14px;padding:12px 14px;display:none;align-items:center;justify-content:space-between;
        gap:12px;font-size:17px;font-weight:700;z-index:30}
  .undo button{background:#fff;color:#1f2a44;border:none;border-radius:10px;padding:10px 16px;
               font-size:17px;font-weight:700;min-height:auto}

  .idle{border:3px dashed var(--line);border-radius:20px;padding:46px 20px;text-align:center;
        color:var(--soft);font-size:28px}
  .idle small{display:block;margin-top:8px;font-size:var(--fs-small)}

  h3{font-size:30px;margin:26px 0 10px}
  .row{display:flex;gap:12px;align-items:baseline;padding:14px 0;border-bottom:2px solid #e8eef7;
       font-size:var(--fs-base)}
  .row .t{color:var(--soft);width:78px;flex:none;font-variant-numeric:tabular-nums}
  .row .n{flex:1;color:var(--ink);font-weight:600}
  .pill{font-size:var(--fs-small);border-radius:999px;padding:3px 12px;white-space:nowrap;font-weight:700}
  .pill.ok{background:var(--okbg);color:var(--ok)}
  .pill.warn{background:var(--warnbg);color:var(--warn)}
  .pill.bad{background:var(--badbg);color:var(--bad)}
  .pill.idle{background:#e9eef6;color:var(--soft)}

  .stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
  .stat{background:#fff;border:2px solid #e8eef7;border-radius:14px;padding:14px 16px}
  .stat .k{font-size:var(--fs-small);color:var(--soft)}
  .stat .v{font-size:40px;font-weight:700;margin-top:2px}

  .field{display:block;margin-top:16px}
  .field span{display:block;font-size:var(--fs-small);color:var(--soft);margin-bottom:8px}
  input{width:100%;font:inherit;font-size:var(--fs-base);padding:16px;border:2px solid var(--line);
        border-radius:12px;background:#fff;color:var(--ink)}
  .box{background:#f7f9fd;border:2px solid #e8eef7;border-radius:14px;padding:16px 18px;margin-top:14px;
       font-size:var(--fs-small);line-height:1.9;color:var(--soft)}
  .code{font-size:40px;letter-spacing:8px;font-weight:700;color:var(--ink)}

  .tabbar{display:flex;border-top:2px solid #e8eef7;background:#fff;padding:4px 0 12px}
  .tab{flex:1;text-align:center;padding:10px 0;font-size:var(--fs-small);color:var(--soft);cursor:pointer;
       min-height:64px}
  .tab .ic{display:block;font-size:26px;line-height:1.2}
  .t
